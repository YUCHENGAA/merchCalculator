name: Deploy Vite App to GitHub Pages

on:
  # 當程式碼推送到 main 分支時自動觸發部署
  push:
    branches: ["main"]
  # 允許在 GitHub Actions 頁面手動點擊按鈕觸發部署
  workflow_dispatch:

# 設定 GitHub Pages 部署所需的權限
permissions:
  contents: read
  pages: write
  id-token: write

# 確保同一時間只有一個部署任務在執行，避免衝突
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # 階段一：建置專案 (Build)
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 程式碼
        uses: actions/checkout@v4

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: 安裝依賴套件
        run: npm ci

      - name: 打包建置專案
        run: npm run build

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上傳打包產物 (dist 資料夾)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  # 階段二：部署上線 (Deploy)
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
